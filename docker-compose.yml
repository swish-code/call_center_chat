services:
  db:
    image: pgvector/pgvector:pg16
    container_name: callcenter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: callcenter
    ports:
      - "5432:5432"
    volumes:
      - callcenter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d callcenter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  callcenter_pgdata:
